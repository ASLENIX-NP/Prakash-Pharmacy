# Render Blueprint specification for Prakash Pharmacy
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: prakash-pharmacy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prakash-pharmacy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: prakash-pharmacy-frontend
          property: host
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_FIRST_NAME
        sync: false
      - key: SEED_ADMIN_LAST_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: static
    name: prakash-pharmacy-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: prakash-pharmacy-backend
          property: host

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: prakash-pharmacy-db
    plan: free
    databaseName: prakash_pharmacy
    user: prakash_admin
